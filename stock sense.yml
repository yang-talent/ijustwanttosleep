    - data:
        code: "def main(stock_code_1: str, stock_code_2: str) -> dict:\n    def to_yahoo_url(code):\n\
          \        code = code.strip().upper()\n        if not code:\n           \
          \ return ''\n        if code.isdigit() and len(code) == 6:\n           \
          \ symbol = code + '.SS' if code.startswith('6') else code + '.SZ'\n    \
          \    elif code.isdigit() and len(code) <= 5:\n            symbol = code.zfill(4)\
          \ + '.HK'\n        else:\n            symbol = code\n        return 'https://query1.finance.yahoo.com/v8/finance/chart/'\
          \ + symbol + '?interval=1d&range=1mo'\n    \n    return {\n        \"url1\"\
          : to_yahoo_url(stock_code_1),\n        \"url2\": to_yahoo_url(stock_code_2),\n\
          \    }\n\n"
