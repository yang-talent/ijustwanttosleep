            从以下5个维度对每只股票评分（满分5分）：\n1. 估值\n2. 盈利能力\n3. 技术面\n4. 财务健康\n5. 市场情绪\n\n请严格按照以下格式输出：\n\
            \n## \U0001F4CA 五维度评分雷达图\n\n```echarts\n{\n  \"tooltip\": {},\n  \"legend\"\
