            \ XXXX | XXXX | XXXX元 | XX股 |\n\n> \U0001F4B0 基于您的预算 {{budget}} 元，建议资金分配：股票1\
            \ XX% + 股票2 XX%\n请根据用户的投资风格调整建议：\n- 保守型：优先推荐估值低、分红稳定、波动小的股票\n- 平衡型：兼顾成长性和稳定性\n\
            - 激进型：优先推荐成长性强、弹性大的股票\n\n\n\n\n> ⚠️ 本报告仅供参考，不构成投资建议，投资有风险，入市需谨慎。\n\n"
