    - data:
        code: "def main(crowd_data: str, travel_text: str):\n    import json, re\n\
          \n    cleaned = crowd_data.strip()\n    match = re.search(r'```(?:json)?\\\
          s*([\\s\\S]*?)```', cleaned)\n    if match:\n        cleaned = match.group(1).strip()\n\
          \n    data = json.loads(cleaned)\n    labels = list(data.keys())\n    values\
          \ = list(data.values())\n\n    colors = [\n        \"#5B8FF9\", \"#5AD8A6\"\
          , \"#F6BD16\", \"#E8684A\",\n        \"#6DC8EC\", \"#9270CA\", \"#FF9D4D\"\
          , \"#269A99\"\n    ]\n\n    series_data = [\n        {\"value\": v, \"itemStyle\"\
          : {\"color\": colors[i % len(colors)]}}\n        for i, v in enumerate(values)\n\
          \    ]\n\n    echarts_config = {\n        \"title\": {\"text\": \"各景点预估日均人流量\"\
          , \"left\": \"center\"},\n        \"tooltip\": {\"trigger\": \"axis\"},\n\
          \        \"xAxis\": {\n            \"type\": \"category\",\n           \
          \ \"data\": labels,\n            \"axisLabel\": {\"rotate\": 30}\n     \
          \   },\n        \"yAxis\": {\n            \"type\": \"value\",\n       \
          \     \"name\": \"人次\"\n        },\n        \"series\": [{\n           \
          \ \"type\": \"bar\",\n            \"data\": series_data,\n            \"\
          name\": \"日均人流量\",\n            \"label\": {\n                \"show\":\
          \ True,\n                \"position\": \"top\",\n                \"formatter\"\
          : \"{c} 人次\",\n                \"fontSize\": 12\n            },\n      \
          \      \"barMaxWidth\": 60\n        }]\n    }\n\n    chart_block = \"```echarts\\\
          n\" + json.dumps(echarts_config, ensure_ascii=False, indent=2) + \"\\n```\"\
          \n\n    return {\"text\": travel_text + \"\\n\\n\" + chart_block}\n\n\n"
